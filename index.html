<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>我的 FC 游戏机</title>
<link rel="stylesheet" href="data/emulator.min.css">
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --accent: #4a86e8;
    --text: #e8e9ec;
    --text-dim: #8b8f99;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100%;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid #2a2e36;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 8px 0 0;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .game-btn {
    appearance: none;
    border: 1px solid #33373f;
    background: #22252c;
    color: var(--text);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .game-btn:hover { background: #2a2e36; border-color: #3c414a; }
  .game-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .status-text {
    color: var(--text-dim);
    font-size: 13px;
    padding: 4px 2px;
  }
  #game-wrap {
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  #game {
    width: 100%;
    max-width: 900px;
    aspect-ratio: 4 / 3;
    background: #000;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>选择游戏</h1>
  <div id="game-list"><span class="status-text">正在读取游戏列表…</span></div>
</div>

<div id="game-wrap">
  <div id="game"></div>
</div>

<script>
  // ------------------------------------------------------------------
  // ROM 仓库信息 —— 以后加新游戏只需要往这个仓库传文件，这里不用改
  // ------------------------------------------------------------------
  const ROM_OWNER = "MarshaveYang";
  const ROM_REPO = "roms";
  const ROM_BRANCH = "main";

  // 支持的 ROM 扩展名 -> EmulatorJS 核心名称
  // 以后想支持别的机型，在这里加一行映射就行
  const EXT_TO_CORE = {
    nes: "nes", fds: "nes", unif: "nes", unf: "nes",
    sfc: "snes", smc: "snes", fig: "snes",
    gb: "gb",
    gbc: "gbc",
    gba: "gba",
  };

  function extOf(filename) {
    const parts = filename.split(".");
    return parts.length > 1 ? parts.pop().toLowerCase() : "";
  }

  async function fetchGameList() {
    const api = `https://api.github.com/repos/${ROM_OWNER}/${ROM_REPO}/contents/?ref=${ROM_BRANCH}`;
    const res = await fetch(api, { headers: { "Accept": "application/vnd.github+json" } });
    if (!res.ok) {
      throw new Error(`GitHub API 请求失败 (${res.status})`);
    }
    const items = await res.json();
    return items
      .filter(item => item.type === "file" && EXT_TO_CORE[extOf(item.name)])
      .map(item => ({
        name: item.name.replace(/\.[^.]+$/, ""), // 去掉扩展名做显示名
        file: item.name,
        core: EXT_TO_CORE[extOf(item.name)],
        url: item.download_url, // GitHub API 直接给出正确编码的 raw 地址
      }))
      .sort((a, b) => a.name.localeCompare(b.name, "zh-CN"));
  }

  function startGame(game) {
    window.EJS_player = "#game";
    window.EJS_core = game.core;
    window.EJS_gameName = game.name;
    window.EJS_gameUrl = game.url;
    window.EJS_pathtodata = "data/";
    window.EJS_startOnLoaded = true;
    window.EJS_backgroundColor = "#000000";

    const loaderScript = document.createElement("script");
    loaderScript.src = "data/loader.js";
    document.body.appendChild(loaderScript);
  }

  function renderGameList(games, currentFile) {
    const listEl = document.getElementById("game-list");
    listEl.innerHTML = "";
    games.forEach(g => {
      const btn = document.createElement("button");
      btn.className = "game-btn" + (g.file === currentFile ? " active" : "");
      btn.textContent = g.name;
      btn.onclick = () => {
        const url = new URL(location.href);
        url.searchParams.set("rom", g.file);
        location.href = url.toString(); // 整页跳转，保证每次都是干净初始化
      };
      listEl.appendChild(btn);
    });
  }

  (async () => {
    let games;
    try {
      games = await fetchGameList();
    } catch (err) {
      document.getElementById("game-list").innerHTML =
        `<span class="status-text">游戏列表加载失败：${err.message}</span>`;
      return;
    }

    if (games.length === 0) {
      document.getElementById("game-list").innerHTML =
        `<span class="status-text">仓库里还没有识别到 ROM 文件</span>`;
      return;
    }

    const params = new URLSearchParams(location.search);
    const requestedFile = params.get("rom");
    const currentGame = games.find(g => g.file === requestedFile) || games[0];

    renderGameList(games, currentGame.file);
    startGame(currentGame);
  })();
</script>

</body>
</html>
